manifestVersion: 1
id: m45-gopool
category: bitcoin
name: M45 goPool
version: "0.1.3"
tagline: Run a private solo Bitcoin mining pool
description: >-
  M45 goPool connects your miners directly to your Umbrel Bitcoin Node and
  provides Stratum v1, per-worker statistics, saved workers, best-share
  tracking, and a local status dashboard.


  This community package is configured for Bitcoin mainnet. It charges a 2%
  pool fee to 3B86bWqfjdQeLEr8nkeeWU6ygksc2K7MoL; the remaining 98% of a
  block reward is paid to the valid Bitcoin address supplied as the miner's
  Stratum username. The optional operator-donation split is disabled.


  Setup guide and user manual: https://m45core.com/umbrel
developer: M45Core
website: https://m45core.com/umbrel
submitter: M45Core
submission: https://github.com/M45Core/M45-Umbrel-Community-App-Store
dependencies:
  - bitcoin
repo: https://github.com/M45Core/M45-goPool
support: https://m45core.com/umbrel
port: 23080
icon: https://raw.githubusercontent.com/M45Core/M45-goPool/main/data/M45CORE-1024.PNG
gallery:
  - https://github.com/M45Core/M45-goPool/releases/download/v0.1.3/umbrel-dashboard.png
path: ""
releaseNotes: |-
  This release improves share processing efficiency, block serialization, and pool statistics.
  
  - Reduce allocations in payout output construction, submit latency reporting, and duplicate-share tracking.
  - Include the coinbase witness in submitted and saved SegWit blocks. Bitcoin Core previously filled in the missing witness during submission.
  - Correct compact-target decoding for small exponents and reject negative or overflowing targets.
  - Honor `status_listen = ""` to disable HTTP and preserve that setting when rewriting configuration.
  - Fix concurrent share-rate snapshots and miner shutdown accounting. Shares completed after disconnect remain in pool totals without restoring the disconnected miner's hashrate.
  
  **Full Changelog**: https://github.com/M45Core/M45-goPool/compare/v0.1.2...v0.1.3
  
  
  
  Full release: https://github.com/M45Core/M45-goPool/releases/tag/v0.1.3
defaultUsername: ""
defaultPassword: ""
backupIgnore:
  - data/logs
  - data/certbot-webroot
