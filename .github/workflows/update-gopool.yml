name: Update M45 goPool

on:
  repository_dispatch:
    types:
      - gopool-release
  workflow_dispatch:
    inputs:
      tag:
        description: Existing M45-goPool release tag, such as v0.3.5
        required: true
        type: string
      umbrel_version:
        description: Independent Umbrel package version, such as 0.1.0
        required: true
        type: string
      image:
        description: GHCR image name
        required: true
        default: ghcr.io/m45core/m45-gopool
        type: string
      digest:
        description: Multi-platform sha256 image digest
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: update-m45-gopool
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPOSITORY: M45Core/M45-goPool
      RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
      UMBREL_VERSION: ${{ github.event.client_payload.umbrel_version || inputs.umbrel_version }}
      IMAGE_NAME: ${{ github.event.client_payload.image || inputs.image }}
      IMAGE_DIGEST: ${{ github.event.client_payload.digest || inputs.digest }}
    steps:
      - name: Verify store write token
        env:
          UMBREL_STORE_TOKEN: ${{ secrets.UMBREL_STORE_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${UMBREL_STORE_TOKEN}" ]]; then
            echo "Add UMBREL_STORE_TOKEN with Contents write access to this repository." >&2
            exit 1
          fi

      - name: Check out store
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.UMBREL_STORE_TOKEN }}

      - name: Validate release inputs
        shell: bash
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi
          if [[ ! "${UMBREL_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid Umbrel package version: ${UMBREL_VERSION}" >&2
            exit 1
          fi
          if [[ "${IMAGE_NAME}" != "ghcr.io/m45core/m45-gopool" ]]; then
            echo "Unexpected image name: ${IMAGE_NAME}" >&2
            exit 1
          fi
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid image digest: ${IMAGE_DIGEST}" >&2
            exit 1
          fi

      - name: Verify source tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${SOURCE_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify immutable multi-platform image
        run: docker buildx imagetools inspect "${IMAGE_NAME}:${RELEASE_TAG}@${IMAGE_DIGEST}" >/dev/null

      - name: Read source release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes_file="${RUNNER_TEMP}/gopool-release-notes.md"
          gh release view "${RELEASE_TAG}" \
            --repo "${SOURCE_REPOSITORY}" \
            --json body \
            --jq '.body // ""' > "${notes_file}"
          printf '\n\nFull release: https://github.com/%s/releases/tag/%s\n' \
            "${SOURCE_REPOSITORY}" "${RELEASE_TAG}" >> "${notes_file}"

      - name: Update package
        run: |
          python3 scripts/update-gopool-release.py \
            --app-dir m45-gopool \
            --tag "${RELEASE_TAG}" \
            --umbrel-version "${UMBREL_VERSION}" \
            --image "${IMAGE_NAME}" \
            --digest "${IMAGE_DIGEST}" \
            --release-notes-file "${RUNNER_TEMP}/gopool-release-notes.md"
          python3 scripts/validate-store.py

      - name: Commit store update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            m45-gopool/VERSION \
            m45-gopool/docker-compose.yml \
            m45-gopool/umbrel-app.yml
          if git diff --cached --quiet; then
            echo "The Umbrel package is already current."
            exit 0
          fi
          git commit -m "Update M45 goPool to ${RELEASE_TAG} (Umbrel ${UMBREL_VERSION})"
          git push origin HEAD:main
